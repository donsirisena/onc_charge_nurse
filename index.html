<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Type" content="XMLCCLREQUEST,APPLINK,MPAGES_EVENT,CCLLINK" name="discern">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Oncology Charge Nurse Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="page-header no-print">
    <div><h1>Oncology Charge Nurse Dashboard</h1><p>Oncology Clinic · Daily appointments</p></div>
    <div class="header-right"><span id="lastUpdated" class="muted"></span></div>
  </header>
  <main class="page-container">
    <section class="toolbar no-print" aria-label="Appointment filters">
      <div class="field"><label for="appointmentDate">Appointment date</label><input id="appointmentDate" type="date"></div>
      <div class="field"><label for="attendingFilter">Attending physician</label><select id="attendingFilter"><option value="all">All Attendings</option></select></div>
      <div class="field search-field"><label for="searchBox">Search patient / MRN</label><input id="searchBox" type="search" placeholder="Search patient or MRN..."></div>
      <div class="toolbar-actions"><button id="refreshButton" type="button" class="secondary">↻ Refresh</button><button id="printOptionsButton" type="button" class="primary">▣ Print Options</button></div>
    </section>
    <section class="stats no-print" aria-label="Summary">
      <div class="stat"><span>Appointments</span><strong id="appointmentCount">0</strong></div>
      <div class="stat"><span>Attendings</span><strong id="attendingCount">0</strong></div>
      <div class="stat"><span>With notes</span><strong id="notesCount">0</strong></div>
      <div class="stat"><span>Checked In</span><strong id="completedCount">0</strong></div>
    </section>
    <div id="notice" class="notice no-print" role="status" aria-live="polite"></div>
    <div class="view-heading no-print"><div><h2>Appointments</h2><p id="filterSummary" class="muted"></p></div><div class="view-controls"><label><input type="checkbox" id="showNotes" checked> Show nurse notes</label><button type="button" id="expandAll" class="text-button">Expand all</button><button type="button" id="collapseAll" class="text-button">Collapse all</button></div></div>
    <section id="appointmentGroups" class="groups no-print" aria-label="Appointment list"></section>
    <section id="printArea" class="print-only" aria-label="Printable appointment list"></section>
  </main>
  <dialog id="printDialog" class="print-dialog no-print">
    <form method="dialog" id="printForm">
      <div class="dialog-heading"><h2>Print Options</h2><button type="button" id="closePrint" class="icon-button" aria-label="Close">×</button></div>
      <fieldset><legend>Print layout</legend>
        <label><input type="radio" name="printLayout" value="simple" checked> Simple Daily Appointment List</label>
        <label><input type="radio" name="printLayout" value="detailed"> Detailed Appointment List</label>
        <label><input type="radio" name="printLayout" value="attending"> Appointments by Attending</label>
        <label><input type="radio" name="printLayout" value="worksheet"> Nurse Worksheet (writing space)</label>
      </fieldset>
      <div class="field"><label for="printAttending">Attending to print</label><select id="printAttending"><option value="current">Use dashboard selection</option><option value="all">All Attendings</option></select></div>
      <label class="check"><input type="checkbox" id="printNotes"> Include nurse comments</label>
      <label class="check"><input type="checkbox" id="printHighlights" checked> Include row highlighting</label>
      <label class="check"><input type="checkbox" id="printStatuses"> Include appointment status</label>
      <div class="dialog-actions"><button type="button" id="cancelPrint" class="secondary">Cancel</button><button type="button" id="previewPrint" class="secondary">Preview on page</button><button type="button" id="doPrint" class="primary">Print</button></div>
    </form>
  </dialog>
  <script src="script.js"></script>
<div style="position:fixed; top:100px; right:20px; z-index:99999; background:white; padding:10px; border:2px solid red;">
    <button
        type="button"
        onclick="CCLLINK('mrd_onc_nursing_schedule', '', 0)"
    >
        Run Original Nursing Report
    </button>
</div>
  
</body>
</html>
